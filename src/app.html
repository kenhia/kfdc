<!doctype html>
<html lang="en" style="background: #15170f">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#15170f" />
		<!--
		  The INSTALLED app's identity (#1494, sprint 018). These live here rather
		  than in `+layout.svelte` on purpose: `%sveltekit.assets%` paths are static
		  and un-hashed, and the install path fetches them outside any page render.
		  An icon imported through Vite is served from a hashed
		  `/_app/immutable/assets/…` URL, which is fine for a tab and useless as a
		  shortcut icon.

		  Without a manifest and a raster icon of at least 128px, Chromium/Edge
		  synthesise a monogram tile from the title — which is where the "K" on Ken's
		  taskbar came from. The tab was always right; only the install path was
		  starved.

		  The SVG `<link rel="icon">` stays in `+layout.svelte`, where a route can
		  still override it, and it is what keeps the TAB crisp.
		-->
		<link rel="icon" type="image/png" sizes="128x128" href="%sveltekit.assets%/favicon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
